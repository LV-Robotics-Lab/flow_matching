name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  package-and-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[train,dev]'

      - name: Compile Python sources
        run: python -m compileall -q .prometheus lv_flow_matching tests

      - name: Verify installed import outside the repository
        run: cd /tmp && python -c "import pathlib, lv_flow_matching; print(pathlib.Path(lv_flow_matching.__file__).resolve())"

      - name: Check launcher interfaces
        run: |
          ./scripts/train.sh --help
          ./scripts/precompute.sh --help
          ./scripts/finetune.sh --help
          ./scripts/run_all.sh --help
          ./scripts/train_embodiment.sh --help

      - name: Run hardware-independent tests
        run: python -m pytest -q .prometheus/test_adapter.py tests
