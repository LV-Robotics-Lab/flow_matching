[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lv-robotics-flow-matching"
version = "0.1.0"
description = "LV Robotics Flow Matching policy training and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0,<2.0.0",
  "PyYAML>=6.0",
  "timm>=0.9.12",
  "einops>=0.7.0",
]

[project.optional-dependencies]
train = [
  "tqdm>=4.66.0",
  "zarr>=3.0.10,<4",
  "numcodecs>=0.13.0",
  "tensorboard>=2.14.0",
  "matplotlib>=3.7.0",
  "opencv-python>=4.8.0",
]
dev = [
  "pytest>=7.4",
]

[project.urls]
Repository = "https://github.com/LV-Robotics-Lab/flow_matching"

[tool.setuptools.packages.find]
where = ["."]
include = ["lv_flow_matching*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
