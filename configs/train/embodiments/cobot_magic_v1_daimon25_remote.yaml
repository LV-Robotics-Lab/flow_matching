profile:
  id: cobot_magic_v1_daimon25_remote
  embodiment: cobot_magic_v1
  provenance:
    repository: https://github.com/LV-Robotics-Lab/PrometheusV4.git
    branch: hardware/cobot-daimon
    revision: 8f2a69cb7e364001d9e57af1c044c92b4a7e4b0a
    source_path: prometheus/policy/flow_matching/configs/train/cobot_magic_joint_unet_teleop_daimon25_remote.yaml
    source_sha256: a2cec6a20a52815738b132c1d5b432e2de66f9e5bf9f78405595d5f21fe0a5a4
  hardware_imports_allowed: false
  status: maintained

seed: 42

paths:
  data_root: /absolute/path/to/policy-data/cobot_magic_v1

runtime:
  device: cuda

output:
  root_dir: ${paths.data_root}/artifacts
  run_name: teleop_daimon_unet25

data:
  root_dir: ${paths.data_root}/data/teleop_daimon_fm_25hz
  window_size: 8
  stride: 1
  n_image_steps: 1
  action_horizon: 32
  action_type: joint
  action_dim: 14
  action_representation: absolute
  use_tactile: false
  mix_base_remove_hand: false
  camera_views: [base_0, left_wrist_0, right_wrist_0]
  image_size: 224
  image_as_uint8: true
  use_camera_latent: true
  preload_camera: false
  latent_cache_root_dir: ${data.root_dir}/latent_cache/{auto}
  camera_key: camera
  tactile_key: tactile
  state_key: state_25hz
  action_key: action_25hz
  norm:
    output_range: [-1, 1]
    max_windows: 100000
  memory:
    enabled: false
    history_frames: 128
    recent_frame: 0
    visual_history_length: 128
    sample_stride: 8
    visual_recent_frame: 0

models:
  fm:
    cond_dim: 256
    n_image_views: 3
    image_encoder_name: dinov2
    dino_model_name: vit_small_patch14_dinov2.lvd142m
    freeze_image_encoder: true
    image_pretrained: true
    image_feat_dim: 256
    view_pool: global_concat
    local_pool_size: 2
    local_attn_heads: 4
    local_attn_dropout: 0.1
    use_tactile: false
    tactile_feat_dim: 256
    tactile_temporal_pool: conv1d
    state_feat_dim: 256
    state_pool: flatten
    diffusion_step_embed_dim: 256
    velocity_model: unet
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    dit_hidden_dim: 512
    dit_depth: 14
    dit_num_heads: 8
    dit_mlp_ratio: 4.0
    dit_dropout: 0.1
    num_inference_steps: 32
    solver: euler
  memory:
    method: fusion
    injection: concat_global_cond
    dim: 256
    num_queries: 3
    visual_heads: 4
    state_hidden_dim: 64
    state_layers: 2
    state_heads: 4
    dropout: 0.1
    cross_attn_layers: [3, 7, 11]
    visual_layers: 2
    state_channels: 128
    state_mem_dim: 64

train:
  batch_size: 32
  num_workers: 8
  drop_last: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  ddp_find_unused_parameters: true
  epochs: 200
  grad_clip: 1.0
  use_amp: true
  open_loop_test_every: 20
  open_loop_test_max_batches: 16
  plot_samples: 32
  plot_dims: auto
  max_train_batches: null
  resume_path: null
  resume_mode: full
  optimizer:
    lr: 3.0e-4
    min_lr: 1.0e-6
    weight_decay: 1.0e-4
    scheduler: none

checkpoint:
  save_every: 10

precompute:
  batch_size: 64
  device: cuda
  overwrite: false
  output_path: null
  token_mode: cls

deploy:
  action_process: abs_qpos
  action_hz: 25.0
